<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字华容道</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-purple-50">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [numbers, setNumbers] = React.useState([]);
            const [emptyIndex, setEmptyIndex] = React.useState(8);
            const [moves, setMoves] = React.useState(0);
            const [time, setTime] = React.useState(0);
            const [isPlaying, setIsPlaying] = React.useState(false);
            const [nickname, setNickname] = React.useState('游客');
            const [boardSize, setBoardSize] = React.useState(3);
            const [showLevelSelect, setShowLevelSelect] = React.useState(false);
            const [showNicknameModal, setShowNicknameModal] = React.useState(false);
            const [tempNickname, setTempNickname] = React.useState('');

            const timerRef = React.useRef(null);

            // 打乱数组的函数
            const shuffleArray = (array) => {
                const newArray = [...array];
                for (let i = newArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                }
                return newArray;
            };

            // 检查是否可以移动
            const canMove = (clickedIndex) => {
                const row = Math.floor(clickedIndex / boardSize);
                const col = clickedIndex % boardSize;
                const emptyRow = Math.floor(emptyIndex / boardSize);
                const emptyCol = emptyIndex % boardSize;
                
                return (row === emptyRow && Math.abs(col - emptyCol) === 1) ||
                       (col === emptyCol && Math.abs(row - emptyRow) === 1);
            };

            // 检查是否获胜
            const checkWin = (newNumbers) => {
                return newNumbers.every((num, index) => 
                    !num ? index === newNumbers.length - 1 : num === index + 1
                );
            };

            // 移动方块
            const moveBlock = (clickedIndex) => {
                if (!isPlaying || !canMove(clickedIndex)) return;

                const newNumbers = [...numbers];
                [newNumbers[clickedIndex], newNumbers[emptyIndex]] = [newNumbers[emptyIndex], newNumbers[clickedIndex]];
                setNumbers(newNumbers);
                setEmptyIndex(clickedIndex);
                setMoves(moves + 1);

                if (checkWin(newNumbers)) {
                    setIsPlaying(false);
                    if (timerRef.current) {
                        clearInterval(timerRef.current);
                    }
                }
            };

            // 初始化游戏
            const initGame = () => {
                const totalCells = boardSize * boardSize;
                const nums = Array.from({length: totalCells - 1}, (_, i) => i + 1);
                nums.push(null);
                const shuffledNums = shuffleArray(nums);
                setNumbers(shuffledNums);
                setEmptyIndex(shuffledNums.indexOf(null));
                setMoves(0);
                setTime(0);
                setIsPlaying(true);
                
                if (timerRef.current) {
                    clearInterval(timerRef.current);
                }
                timerRef.current = setInterval(() => {
                    setTime(prev => prev + 0.01);
                }, 10);
            };

            // 关卡选择模态框
            const LevelSelectModal = () => (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white p-6 rounded-lg max-w-sm w-full">
                        <h2 className="text-xl font-bold mb-4">选择关卡</h2>
                        <div className="grid grid-cols-2 gap-4">
                            {[3, 4, 5, 6].map(size => (
                                <button
                                    key={size}
                                    onClick={() => {
                                        setBoardSize(size);
                                        setShowLevelSelect(false);
                                        setIsPlaying(false);
                                    }}
                                    className="py-3 px-4 bg-orange-100 text-orange-600 rounded-lg hover:bg-orange-200"
                                >
                                    {size}x{size}
                                </button>
                            ))}
                        </div>
                        <button
                            onClick={() => setShowLevelSelect(false)}
                            className="mt-4 w-full py-2 bg-gray-200 rounded-lg hover:bg-gray-300"
                        >
                            关闭
                        </button>
                    </div>
                </div>
            );

            // 清理定时器
            React.useEffect(() => {
                return () => {
                    if (timerRef.current) {
                        clearInterval(timerRef.current);
                    }
                };
            }, []);

            // 初始化棋盘
            React.useEffect(() => {
                const totalCells = boardSize * boardSize;
                const nums = Array.from({length: totalCells - 1}, (_, i) => i + 1);
                nums.push(null);
                setNumbers(nums);
                setEmptyIndex(nums.length - 1);
            }, [boardSize]);

            // 昵称修改模态框
            const NicknameModal = () => (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white p-6 rounded-lg max-w-sm w-full">
                        <h2 className="text-xl font-bold mb-4">修改昵称</h2>
                        <input
                            type="text"
                            value={tempNickname}
                            onChange={(e) => setTempNickname(e.target.value)}
                            placeholder="请输入新昵称"
                            className="w-full px-3 py-2 border rounded-lg mb-4"
                            maxLength="10"
                        />
                        <div className="flex gap-2">
                            <button
                                onClick={() => {
                                    if (tempNickname.trim()) {
                                        setNickname(tempNickname.trim());
                                        setShowNicknameModal(false);
                                    }
                                }}
                                className="flex-1 py-2 bg-orange-400 text-white rounded-lg hover:bg-orange-500"
                            >
                                确定
                            </button>
                            <button
                                onClick={() => setShowNicknameModal(false)}
                                className="flex-1 py-2 bg-gray-200 rounded-lg hover:bg-gray-300"
                            >
                                取消
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-md mx-auto p-4">
                    {showLevelSelect && <LevelSelectModal />}
                    {showNicknameModal && <NicknameModal />}
                    <div className="bg-white rounded-lg shadow-lg p-6 mb-4">
                        <div className="flex justify-between mb-4">
                            <div 
                                onClick={() => {
                                    setTempNickname(nickname);
                                    setShowNicknameModal(true);
                                }}
                                className="text-gray-700 cursor-pointer hover:text-orange-600 flex items-center"
                            >
                                昵称：{nickname}
                                <span className="ml-1 text-sm">✏️</span>
                            </div>
                            <button 
                                onClick={() => setShowLevelSelect(true)}
                                className="px-4 py-1 bg-orange-100 text-orange-600 rounded"
                            >
                                选择关卡
                            </button>
                        </div>
                        <button 
                            onClick={initGame}
                            className="w-full py-2 bg-orange-400 text-white rounded-lg mb-4 hover:bg-orange-500"
                        >
                            开始游戏
                        </button>
                        <div className="grid grid-cols-2 gap-4 mb-4">
                            <button className="py-2 bg-orange-50 text-orange-600 rounded-lg">游戏记录</button>
                            <button className="py-2 bg-orange-50 text-orange-600 rounded-lg">排行榜</button>
                        </div>
                    </div>

                    <div className="aspect-square">
                        <div 
                            className="grid gap-2 bg-white rounded-lg p-2" 
                            style={{ gridTemplateColumns: `repeat(${boardSize}, 1fr)` }}
                        >
                            {numbers.map((number, index) => (
                                <div
                                    key={index}
                                    onClick={() => moveBlock(index)}
                                    className={`aspect-square flex items-center justify-center 
                                        ${boardSize > 4 ? 'text-lg' : 'text-2xl'} font-bold rounded-lg
                                        ${number ? 'bg-orange-100 text-orange-600 cursor-pointer hover:bg-orange-200' : 'bg-white'}`}
                                >
                                    {number}
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="mt-4 flex justify-between items-center text-gray-600">
                        <div className="flex items-center">
                            <span className="mr-1">⏱️</span>
                            {time.toFixed(2)}
                        </div>
                        <div className="flex items-center">
                            <span className="mr-1">👣</span>
                            {moves}步
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
