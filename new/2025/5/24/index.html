<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>想贴贴了</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            position: relative;
        }

        .text {
            position: absolute;
            color: #fff;
            font-weight: bold;
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        /* 基础动画样式 */
        .bounce {
            animation: bounce 2s infinite ease-in-out;
        }

        .float {
            animation: float 3s infinite ease-in-out;
        }

        .pulse {
            animation: pulse 1.5s infinite ease-in-out;
        }

        .shake {
            animation: shake 0.5s infinite ease-in-out;
        }

        .rotate {
            animation: rotate 4s infinite linear;
        }

        .rainbow {
            animation: rainbow 2s infinite linear;
        }

        .fade {
            animation: fade 3s infinite ease-in-out;
        }

        .zoom {
            animation: zoom 2s infinite ease-in-out;
        }

        .slide-left {
            animation: slideLeft 4s infinite linear;
        }

        .slide-right {
            animation: slideRight 4s infinite linear;
        }

        .flip {
            animation: flip 2s infinite ease-in-out;
        }

        .glow {
            animation: glow 2s infinite ease-in-out alternate;
        }

        /* 动画定义 */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            60% { transform: translateY(-15px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rainbow {
            0% { color: #ff0000; }
            16% { color: #ff8000; }
            33% { color: #ffff00; }
            50% { color: #00ff00; }
            66% { color: #0080ff; }
            83% { color: #8000ff; }
            100% { color: #ff0000; }
        }

        @keyframes fade {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes zoom {
            0%, 100% { transform: scale(0.8); }
            50% { transform: scale(1.3); }
        }

        @keyframes slideLeft {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        @keyframes slideRight {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }

        @keyframes flip {
            0%, 100% { transform: rotateY(0deg); }
            50% { transform: rotateY(180deg); }
        }

        @keyframes glow {
            from { 
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.8),
                           0 0 30px rgba(255, 105, 180, 0.6),
                           0 0 40px rgba(255, 105, 180, 0.4);
            }
            to { 
                text-shadow: 0 0 30px rgba(255, 255, 255, 1),
                           0 0 50px rgba(255, 105, 180, 0.8),
                           0 0 70px rgba(255, 105, 180, 0.6);
            }
        }

        /* 响应式字体大小 */
        @media (max-width: 480px) {
            .text {
                font-size: clamp(16px, 4vw, 24px);
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .text {
                font-size: clamp(20px, 5vw, 32px);
            }
        }

        @media (min-width: 769px) {
            .text {
                font-size: clamp(24px, 3vw, 48px);
            }
        }

        /* 特殊效果样式 */
        .neon {
            color: #fff;
            text-shadow: 0 0 5px #fff,
                       0 0 10px #fff,
                       0 0 15px #ff00de,
                       0 0 20px #ff00de,
                       0 0 35px #ff00de,
                       0 0 40px #ff00de;
        }

        .fire {
            color: #ff4500;
            text-shadow: 0 0 20px #ff4500,
                       0 0 40px #ff8c00,
                       0 0 60px #ffd700;
        }

        .ice {
            color: #87ceeb;
            text-shadow: 0 0 20px #87ceeb,
                       0 0 40px #4169e1,
                       0 0 60px #0000ff;
        }
    </style>
</head>
<body>
    <script>
        const texts = ['想贴贴了', '贴贴', '想贴贴', '贴贴吖', '想要贴贴'];
        const animations = ['bounce', 'float', 'pulse', 'shake', 'rotate', 'rainbow', 'fade', 'zoom', 'slide-left', 'slide-right', 'flip', 'glow'];
        const effects = ['', 'neon', 'fire', 'ice'];
        
        function getRandomPosition() {
            const padding = 50;
            return {
                x: Math.random() * (window.innerWidth - padding * 2) + padding,
                y: Math.random() * (window.innerHeight - padding * 2) + padding
            };
        }
        
        function createText() {
            const textElement = document.createElement('div');
            textElement.className = 'text';
            textElement.textContent = texts[Math.floor(Math.random() * texts.length)];
            
            // 随机位置
            const position = getRandomPosition();
            textElement.style.left = position.x + 'px';
            textElement.style.top = position.y + 'px';
            
            // 随机动画
            const animation = animations[Math.floor(Math.random() * animations.length)];
            textElement.classList.add(animation);
            
            // 随机特效
            const effect = effects[Math.floor(Math.random() * effects.length)];
            if (effect) {
                textElement.classList.add(effect);
            }
            
            // 随机延迟
            textElement.style.animationDelay = Math.random() * 2 + 's';
            
            document.body.appendChild(textElement);
            
            // 自动删除元素
            setTimeout(() => {
                if (textElement.parentNode) {
                    textElement.parentNode.removeChild(textElement);
                }
            }, 8000);
        }
        
        // 持续创建文字
        function startAnimation() {
            createText();
            setTimeout(startAnimation, Math.random() * 1000 + 500);
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 立即创建几个文字
            for (let i = 0; i < 3; i++) {
                setTimeout(createText, i * 300);
            }
            
            // 开始持续动画
            setTimeout(startAnimation, 1000);
        });
        
        // 触摸事件 - 手机端交互
        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            createText();
        });
        
        // 点击事件 - 桌面端交互
        document.addEventListener('click', (e) => {
            createText();
        });
        
        // 响应窗口大小变化
        window.addEventListener('resize', () => {
            // 重新计算所有文字位置，避免超出边界
            const texts = document.querySelectorAll('.text');
            texts.forEach(text => {
                const position = getRandomPosition();
                text.style.left = position.x + 'px';
                text.style.top = position.y + 'px';
            });
        });
    </script>
</body>
</html>
