<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI宿舍分配算法可视化</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .description {
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .input-section {
            flex: 1;
            min-width: 300px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .output-section {
            flex: 2;
            min-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        
        textarea, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        button {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: block;
            width: 100%;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        
        .results {
            margin-top: 20px;
        }
        
        .dorm-room {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #6e8efb;
        }
        
        .dorm-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            align-items: center;
        }
        
        .dorm-title {
            font-weight: 600;
            font-size: 1.2rem;
        }
        
        .compatibility-score {
            background: #6e8efb;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .mbti-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .mbti-tag {
            background: #e9ecef;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .visualization {
            margin-top: 30px;
            text-align: center;
        }
        
        .chart-container {
            height: 300px;
            margin-top: 20px;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            text-align: center;
        }
        
        .stat-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            flex: 1;
            margin: 0 10px;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #6e8efb;
            margin: 10px 0;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }
        
        .algorithm-steps {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .step {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .step:last-child {
            border-bottom: none;
        }
        
        .step-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: #444;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .stats {
                flex-direction: column;
                gap: 15px;
            }
            
            .stat-item {
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MBTI宿舍分配算法可视化</h1>
            <p class="description">基于MBTI类型兼容性，使用模拟退火算法优化宿舍分配，提高宿舍内和谐度</p>
        </header>
        
        <div class="main-content">
            <div class="input-section">
                <h2>输入参数</h2>
                <div class="form-group">
                    <label for="mbti-input">MBTI类型列表（每行一个）:</label>
                    <textarea id="mbti-input" placeholder="例如:
INFJ
ENFP
INTJ
ENTP
ISFJ
ESFP
INTP
ENTJ">INFJ
ENFP
INTJ
ENTP
ISFJ
ESFP
INTP
ENTJ
ISTP
ESTJ
INFP
ENFJ
ISTJ
ESTP
ISFP
ESFJ</textarea>
                </div>
                
                <div class="form-group">
                    <label for="room-size">每个宿舍人数:</label>
                    <input type="number" id="room-size" min="2" max="10" value="4">
                </div>
                
                <div class="form-group">
                    <label for="iterations">算法迭代次数:</label>
                    <input type="number" id="iterations" min="100" max="10000" value="1000">
                </div>
                
                <button id="run-algorithm">运行分配算法</button>
            </div>
            
            <div class="output-section">
                <h2>分配结果</h2>
                <div id="results" class="results">
                    <p>点击"运行分配算法"按钮查看结果</p>
                </div>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-label">平均和谐值</div>
                        <div class="stat-value" id="avg-score">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">最高宿舍和谐值</div>
                        <div class="stat-value" id="max-score">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">最低宿舍和谐值</div>
                        <div class="stat-value" id="min-score">-</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="algorithm-steps">
            <h2>算法流程</h2>
            <div class="step">
                <div class="step-title">1. 数据准备</div>
                <div class="step-desc">解析输入的MBTI类型，验证有效性，计算需要分配的宿舍数量</div>
            </div>
            <div class="step">
                <div class="step-title">2. 初始分配</div>
                <div class="step-desc">随机将人员分配到各个宿舍，计算初始平均和谐值</div>
            </div>
            <div class="step">
                <div class="step-title">3. 模拟退火优化</div>
                <div class="step-desc">通过随机交换不同宿舍的人员，逐步优化整体和谐值</div>
            </div>
            <div class="step">
                <div class="step-title">4. 结果输出</div>
                <div class="step-desc">输出最优分配方案和各宿舍和谐值</div>
            </div>
        </div>
        
        <footer>
            <p>MBTI宿舍分配算法可视化工具 &copy; 2023</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const runButton = document.getElementById('run-algorithm');
            const resultsContainer = document.getElementById('results');
            const avgScoreElement = document.getElementById('avg-score');
            const maxScoreElement = document.getElementById('max-score');
            const minScoreElement = document.getElementById('min-score');
            
            runButton.addEventListener('click', function() {
                // 获取输入参数
                const mbtiInput = document.getElementById('mbti-input').value;
                const roomSize = parseInt(document.getElementById('room-size').value);
                const iterations = parseInt(document.getElementById('iterations').value);
                
                // 解析MBTI输入
                const mbtiList = mbtiInput.split('\n')
                    .map(item => item.trim().toUpperCase())
                    .filter(item => item.length === 4);
                
                if (mbtiList.length === 0) {
                    alert('请输入有效的MBTI类型');
                    return;
                }
                
                if (roomSize < 2 || roomSize > 10) {
                    alert('宿舍人数应在2-10人之间');
                    return;
                }
                
                // 运行算法
                const result = allocateDorms(mbtiList, roomSize, iterations);
                
                // 显示结果
                displayResults(result);
            });
            
            function calculateCompatibility(mbti1, mbti2) {
                // 如果两个类型相同，直接返回高和谐值
                if (mbti1 === mbti2) {
                    return 85;
                }
                
                // 提取四个维度的字母
                const e_i1 = mbti1[0], s_n1 = mbti1[1], f_t1 = mbti1[2], j_p1 = mbti1[3];
                const e_i2 = mbti2[0], s_n2 = mbti2[1], f_t2 = mbti2[2], j_p2 = mbti2[3];
                
                // 初始化基础分数
                let baseScore = 50;
                
                // 计算各个维度的兼容性分数
                // 1. E/I维度：互补为佳
                if (e_i1 !== e_i2) {
                    baseScore += 10;  // 内外向互补
                }
                
                // 2. S/N维度：相同为佳（感知世界的方式）
                if (s_n1 === s_n2) {
                    baseScore += 12;
                }
                
                // 3. F/T维度：相同为佳（决策方式）
                if (f_t1 === f_t2) {
                    baseScore += 15;
                }
                
                // 4. J/P维度：互补为佳（生活方式）
                if (j_p1 !== j_p2) {
                    baseScore += 8;
                }
                
                // 特殊的高兼容性组合
                const highCompatibilityPairs = [
                    new Set(['INFJ', 'ENFP']), new Set(['INFJ', 'ENTP']), 
                    new Set(['INFP', 'ENFJ']), new Set(['INFP', 'ENTJ']),
                    new Set(['INTJ', 'ENFP']), new Set(['INTJ', 'ENTP']), 
                    new Set(['INTP', 'ENFJ']), new Set(['INTP', 'ENTJ']),
                    new Set(['ENFJ', 'INFP']), new Set(['ENFJ', 'ISFP']), 
                    new Set(['ENTJ', 'INTP']), new Set(['ENTJ', 'ISTP']),
                    new Set(['ENFP', 'INFJ']), new Set(['ENFP', 'INTJ']), 
                    new Set(['ENTP', 'INFJ']), new Set(['ENTP', 'INTJ'])
                ];
                
                const currentPair = new Set([mbti1, mbti2]);
                const isHighCompatibility = highCompatibilityPairs.some(pair => 
                    pair.size === currentPair.size && [...pair].every(value => currentPair.has(value))
                );
                
                if (isHighCompatibility) {
                    baseScore = Math.min(100, baseScore + 20);
                }
                
                // 特殊的低兼容性组合
                const lowCompatibilityPairs = [
                    new Set(['ISTJ', 'ENFP']), new Set(['ISTJ', 'ENTP']), 
                    new Set(['ISFJ', 'ENTP']), new Set(['ISFJ', 'ENFP']),
                    new Set(['ESTJ', 'INFP']), new Set(['ESTJ', 'INTP']), 
                    new Set(['ESFJ', 'INTP']), new Set(['ESFJ', 'INFP'])
                ];
                
                const isLowCompatibility = lowCompatibilityPairs.some(pair => 
                    pair.size === currentPair.size && [...pair].every(value => currentPair.has(value))
                );
                
                if (isLowCompatibility) {
                    baseScore = Math.max(0, baseScore - 25);
                }
                
                // 确保分数在0-100范围内
                return Math.max(0, Math.min(100, baseScore));
            }
            
            function calculateGroupCompatibility(group) {
                if (group.length < 2) {
                    return 100;  // 单人宿舍总是和谐的
                }
                
                let total = 0;
                let count = 0;
                
                // 计算所有两两组合的和谐值
                for (let i = 0; i < group.length; i++) {
                    for (let j = i + 1; j < group.length; j++) {
                        total += calculateCompatibility(group[i], group[j]);
                        count++;
                    }
                }
                
                return count > 0 ? total / count : 0;
            }
            
            function allocateDorms(mbtiList, roomSize, maxIterations) {
                const n = mbtiList.length;
                const numRooms = Math.ceil(n / roomSize);
                
                // 初始随机分配
                const shuffled = [...mbtiList].sort(() => Math.random() - 0.5);
                let allocation = [];
                
                for (let i = 0; i < numRooms; i++) {
                    allocation.push(shuffled.slice(i * roomSize, (i + 1) * roomSize));
                }
                
                // 计算初始平均和谐值
                function calculateTotalScore(alloc) {
                    const scores = alloc.map(room => calculateGroupCompatibility(room));
                    return scores.reduce((sum, score) => sum + score, 0) / scores.length;
                }
                
                let bestScore = calculateTotalScore(allocation);
                let bestAllocation = JSON.parse(JSON.stringify(allocation));
                
                // 使用模拟退火算法优化分配
                let temperature = 1.0;
                const coolingRate = 0.99;
                
                for (let iteration = 0; iteration < maxIterations; iteration++) {
                    // 随机选择两个不同的房间
                    const room1Idx = Math.floor(Math.random() * numRooms);
                    let room2Idx;
                    do {
                        room2Idx = Math.floor(Math.random() * numRooms);
                    } while (room2Idx === room1Idx);
                    
                    const room1 = allocation[room1Idx];
                    const room2 = allocation[room2Idx];
                    
                    // 随机选择每个房间中的一个人
                    const person1Idx = Math.floor(Math.random() * room1.length);
                    const person2Idx = Math.floor(Math.random() * room2.length);
                    
                    // 交换这两个人
                    [room1[person1Idx], room2[person2Idx]] = [room2[person2Idx], room1[person1Idx]];
                    
                    // 计算新的和谐值
                    const newScore = calculateTotalScore(allocation);
                    
                    // 决定是否接受这个交换
                    if (newScore > bestScore) {
                        bestScore = newScore;
                        bestAllocation = JSON.parse(JSON.stringify(allocation));
                    } else {
                        // 以一定概率接受较差的解（模拟退火）
                        const acceptanceProbability = Math.exp((newScore - bestScore) / temperature);
                        if (Math.random() < acceptanceProbability) {
                            bestScore = newScore;
                            bestAllocation = JSON.parse(JSON.stringify(allocation));
                        } else {
                            // 如果不接受，交换回来
                            [room1[person1Idx], room2[person2Idx]] = [room2[person2Idx], room1[person1Idx]];
                        }
                    }
                    
                    // 降低温度
                    temperature *= coolingRate;
                }
                
                // 计算最终每个宿舍的和谐值
                const roomScores = bestAllocation.map(room => calculateGroupCompatibility(room));
                
                return {
                    allocation: bestAllocation,
                    avgScore: bestScore,
                    roomScores: roomScores
                };
            }
            
            function displayResults(result) {
                const { allocation, avgScore, roomScores } = result;
                
                // 更新统计信息
                avgScoreElement.textContent = avgScore.toFixed(2);
                maxScoreElement.textContent = Math.max(...roomScores).toFixed(2);
                minScoreElement.textContent = Math.min(...roomScores).toFixed(2);
                
                // 显示分配结果
                let html = '';
                
                allocation.forEach((room, index) => {
                    const score = roomScores[index];
                    
                    html += `
                        <div class="dorm-room">
                            <div class="dorm-header">
                                <div class="dorm-title">宿舍 ${index + 1}</div>
                                <div class="compatibility-score">${score.toFixed(2)}</div>
                            </div>
                            <div class="mbti-tags">
                    `;
                    
                    room.forEach(mbti => {
                        html += `<span class="mbti-tag">${mbti}</span>`;
                    });
                    
                    html += `
                            </div>
                        </div>
                    `;
                });
                
                resultsContainer.innerHTML = html;
            }
        });
    </script>
</body>
</html>
